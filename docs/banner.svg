  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <circle cx="90" cy="60" r="3" fill="#ffffff" opacity="0.25"/>
  <circle cx="1120" cy="80" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="1060" cy="230" r="3" fill="#ffffff" opacity="0.25"/>
  <circle cx="180" cy="250" r="4" fill="#ffffff" opacity="0.18"/>

  <text x="72" y="112" fill="#ffffff" font-size="52" font-weight="700">AnimeFansubGuide</text>
